# 账然 v0.1 版本目录（Gradle Version Catalog）
#
# 本文件是**唯一依赖与版本来源**：所有依赖版本只在此声明，
# 构建脚本（settings.gradle.kts / build.gradle.kts）只能通过 libs.* 引用，
# 禁止出现字面版本号（依据 docs/04 §19 依赖原则）。
#
# 版本策略（用户决策，2026-10）：
# - 采用 AGP 9.x + Gradle 9.x + Java 21（原先的 AGP 8.9.3 无法满足依赖侧要求：
#   AndroidX/Compose 构件要求 AGP ≥ 9.1.0，见构建日志 "requires Android Gradle plugin 9.1.0 or higher"）。
# - 版本均已核对存在：AGP 9.4.1 / Gradle 9.8.1 / Kotlin 2.3.21 / KSP 2.3.12 /
#   Hilt 2.60.1 / Room 2.8.4 / Compose BOM 2026.09.00。
# - JVM：Java 21（构建与 target 均使用 JDK 21，见 build.gradle.kts 与 gradle.properties）。

[versions]
# ---- 项目标识与版本号（任务书 §4.1.1：唯一来源，build.gradle.kts 只引用）----
applicationId = "com.zhangran.app"
versionName = "0.1.0"
versionCode = "1"

# ---- 构建插件 ----
agp = "9.4.1"
kotlin = "2.3.21"
ksp = "2.3.12"
hilt = "2.60.1"

# ---- SDK ----
# compileSdk 必须 ≥ 37：AndroidX/Compose 2026.09 的构件要求依赖方 compile 到 API 37。
# targetSdk 仍为 36（任务书要求）。
compileSdk = "37"
targetSdk = "36"
minSdk = "31"

# ---- AndroidX / Jetpack ----
coreKtx = "1.17.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# Navigation Compose 不由 Compose BOM 管理，需显式版本
navigation = "2.9.8"

# ---- 持久化（本任务只引入依赖，不建实体）----
room = "2.8.4"
datastore = "1.1.7"

# ---- 测试 ----
junit = "4.13.2"
# instrumentation 测试（T1b 追加：18 页面渲染冒烟测试所需）
androidxTestExtJunit = "1.3.0"
androidxTestEspresso = "3.7.0"
# T2a 追加：Room migration / 设备侧 DB 测试
androidxTestRunner = "1.7.0"
# T2a 追加：room-migration 用 kotlinx-serialization-json 反序列化 schema JSON（需要 core ≥ 1.8），
# 而传递依赖里 serialization-core 被其它 AndroidX 约束在 1.7.3，导致运行时
# AbstractMethodError: GeneratedSerializer.typeParametersSerializers。
# 这里显式把 core 提到与 json 同版（1.8.1）以消除不一致。
kotlinxSerialization = "1.8.1"

[libraries]
# AndroidX 基础
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Compose（版本由 BOM 统一管理）
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

# Navigation Compose（T1b 追加：导航骨架）
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Hilt（依赖注入，本任务必须打通）
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

# Room（本任务只引入依赖与 schema 导出参数，不建实体/DAO）
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# T2a 追加：MigrationTestHelper 与 Room schema 校验
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# 测试
junit = { module = "junit:junit", version.ref = "junit" }
# instrumentation 测试（T1b）
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
# T2a 追加：InstrumentationRegistry 与测试运行器
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
# T2a 追加：与 room-migration 的 kotlinx-serialization-json 对齐（见 [versions] 说明）
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
# 注意：AGP 9.0 起内建 Kotlin，**不要**定义/应用 org.jetbrains.kotlin.android
# （应用会直接报错）。Kotlin 版本仅由 Compose 编译器插件引用（见 kotlin 版本项）。
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
