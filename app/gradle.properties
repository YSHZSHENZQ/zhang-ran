# 账然 v0.1 Gradle 属性
#
# 说明：本文件只放 JVM / AndroidX / Kotlin 基础开关，不放依赖版本
# （依赖版本唯一来源为 app/gradle/libs.versions.toml）。
#
# 重要：**不要**在此写 org.gradle.java.home（硬编码本机路径会让换机器/CI 直接失败）。
# Java 21 的需求改由 build.gradle.kts 的 Gradle Toolchain 表达：
#   java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
# 本机已有的 JDK 21 位于 Android Studio JBR，由 Gradle 自动探测。

# ---- JVM ----
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# 不自动下载工具链；若某台机器找不到 JDK 21，构建会明确报错，而不是静默降级
org.gradle.java.installations.auto-download=false

# ---- 构建性能 ----
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---- AndroidX ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Kotlin ----
kotlin.code.style=official
